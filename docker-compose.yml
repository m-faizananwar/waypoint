# Local development stack. All credentials here are local-only defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # OIDC provider. Imports the waypoint realm with two demo users on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]

  api:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/waypoint
      REDIS_URL: redis://redis:6379
      # The issuer must match the token's iss claim, which Keycloak sets from the URL the client used.
      OIDC_ISSUER: http://localhost:8080/realms/waypoint
      OIDC_JWKS_URI: http://keycloak:8080/realms/waypoint/protocol/openid-connect/certs
      OIDC_AUDIENCE: waypoint-api
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
